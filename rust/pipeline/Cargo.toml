[package]
name = "t2t-pipeline"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
# Never enabled in this repo's builds: the DPDK backend is written to be
# reviewable, not measured, because there is no DPDK-bound NIC here.
dpdk = []

[dependencies]
t2t-spsc = { path = "../spsc" }
t2t-feed = { path = "../feed" }
t2t-book = { path = "../book" }

# The one external dependency in the workspace, Linux-only, for the rxlat
# benchmark's io_uring variant. The libraries above it stay dependency-free.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
libc = "0.2"

[[bench]]
name = "internal"
harness = false

[[bench]]
name = "profile"
harness = false

[lints.rust]
missing_debug_implementations = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
